# Gate for a release. Runs when a version tag (v0.2.1, ...) is pushed, or by hand
# from the Actions tab. It does NOT publish anything — publishing stays manual.
#
# It checks the ACTUAL prepared distribution (brief B7, finding A08), never a
# wheel built here from a checkout without data:
#   - the candidate bundle (made locally by build/make_distribution.py from one
#     completed generation and its strict real-data validation report) is
#     downloaded over HTTPS and its SHA-256 verified BEFORE extraction;
#   - build/check_release.py checks the bundle: every file against candidate.json,
#     the generation against result.json, the wheel and the sdist against the
#     generation's data files, the report's binding to this build id, artifact
#     hashes, code and version, and the tag; then installs the wheel into a clean
#     venv and looks words up from outside the checkout;
#   - a synthetic bundle, a missing report or a missing candidate FAILS.
#
# Where the bundle comes from:
#   - workflow_dispatch: the `bundle_url` and `bundle_sha256` inputs;
#   - tag push: `.github/release-candidate.json` at the tagged revision,
#     {"bundle_url": "https://...", "bundle_sha256": "<64 hex>"}.
#
# What it cannot do: rerun the corpus checks. The 4 GB database is not on the
# runner. The hash-bound strict report records what the local run found; running
# `python build/validate.py --strict` locally remains a documented release step.

name: Release check

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bundle_url:
        description: "HTTPS URL of the release-candidate bundle (.tar.gz)"
        required: true
      bundle_sha256:
        description: "Expected SHA-256 of that tarball"
        required: true

jobs:
  version-matches-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pyproject, __init__ and tag agree
        run: |
          py_ver=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          init_ver=$(grep -m1 '^__version__' wrodfreq/__init__.py | sed 's/.*"\(.*\)"/\1/')
          echo "pyproject=$py_ver  __init__=$init_ver  ref=$GITHUB_REF_NAME"
          [ "$py_ver" = "$init_ver" ]
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then [ "v$py_ver" = "$GITHUB_REF_NAME" ]; fi

  docs-present:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: method.md and sources.md exist and are not empty
        run: |
          test -s docs/method.md
          test -s docs/sources.md

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"
      - run: pytest -q

  candidate:
    name: the prepared release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
      - name: Locate the candidate bundle
        id: locate
        env:
          INPUT_URL: ${{ github.event.inputs.bundle_url }}
          INPUT_SHA: ${{ github.event.inputs.bundle_sha256 }}
        run: |
          url="$INPUT_URL"; sha="$INPUT_SHA"
          if [ -z "$url" ]; then
            if [ ! -f .github/release-candidate.json ]; then
              echo "::error::No release candidate. Prepare one locally (docs/release-runbook.md), host the bundle, and either commit .github/release-candidate.json with bundle_url and bundle_sha256 before tagging, or run this workflow by hand with those inputs."
              exit 1
            fi
            url=$(python -c "import json;print(json.load(open('.github/release-candidate.json'))['bundle_url'])")
            sha=$(python -c "import json;print(json.load(open('.github/release-candidate.json'))['bundle_sha256'])")
          fi
          case "$url" in https://*) ;; *) echo "::error::bundle_url must be https://"; exit 1;; esac
          echo "$sha" | grep -Eq '^[0-9a-fA-F]{64}$' || { echo "::error::bundle_sha256 must be 64 hex digits"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Download (digest verified by check_release.py before extraction)
        run: curl -fsSL --proto '=https' -o "$RUNNER_TEMP/bundle.tar.gz" "${{ steps.locate.outputs.url }}"
      - name: Release preflight on the actual distribution
        run: |
          tag=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="--tag $GITHUB_REF_NAME"; fi
          env -u PYTHONPATH python build/check_release.py --bundle "$RUNNER_TEMP/bundle.tar.gz" \
            --expected-sha256 "${{ steps.locate.outputs.sha }}" --install-test $tag
