# Spec §11 opens with "Validation — the stage that will be skipped, so make it
# CI", and §13's M6 criterion is "validation checks 1-4 and 6 pass in CI".
# This is the part of that which can run on a runner.
#
# What CANNOT run here, and why: `build/validate.py`'s checks 1, 3 and 5 read
# `data/wrodfreq.db` — a 3.7 GB artifact of multi-day ingest runs that is
# gitignored by the repo's "no .db in git, ever" rule — and checks 2 and 4
# cross-reference a local oțios checkout (its installed `wordfreq`, its
# vendored `inflected_forms.db`). Those two already skip rather than fail when
# the reference is absent, by design.
#
# So the pipeline's *logic* is covered here by the test suite instead,
# including an end-to-end run of stages 2-5 over a synthetic database with the
# byte-identical idempotence assertion check 6 makes (tests/test_pipeline.py).
# Running the real validate.py against the real corpus stays a local
# pre-release step.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.10"; test the floor and the
        # current release so a 3.10-incompatible syntax slip fails here rather
        # than for someone who pip-installed on an older interpreter.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (package + dev + build extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"
      - name: Tests
        run: pytest -q

  pipeline-scripts:
    # The build/ scripts are not importable by the test suite's normal paths
    # and have no coverage of their own beyond the units tested in tests/.
    # A syntax error or a bad import in an ingester would otherwise only
    # surface hours into a multi-day job.
    name: build scripts load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"
      - name: Every build script compiles
        run: python -m compileall -q build/
      - name: Every build script's CLI responds
        run: |
          set -e
          for f in build/*.py; do
            case "$(basename "$f")" in
              status.py) continue ;;   # no argparse CLI
            esac
            echo "--- $f --help"
            python "$f" --help > /dev/null
          done

  package:
    name: wheel builds and imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build sdist + wheel
        run: python -m build
      - name: Install the wheel into a clean venv and import it
        # The data file is gitignored, so a wheel built here ships without one.
        # The API must degrade rather than explode: spec §10.1 requires
        # zipf_frequency to answer 0.0 for anything it does not know, and the
        # lemma layer to degrade gracefully when its map is absent.
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install -q dist/*.whl
          /tmp/wheeltest/bin/python -c "
          import wrodfreq
          print('version', wrodfreq.__version__)
          print('lemma_frequency degrades:', wrodfreq.lemma_frequency('casă'))
          "
