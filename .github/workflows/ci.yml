# Spec §11 opens with "Validation — the stage that will be skipped, so make it
# CI", and §13's M6 criterion is "validation checks 1-4 and 6 pass in CI".
# This is the part of that which can run on a runner.
#
# What CANNOT run here, and why: `build/validate.py`'s checks 1, 3 and 5 read
# `data/wrodfreq.db` — a 3.7 GB artifact of multi-day ingest runs that is
# gitignored by the repo's "no .db in git, ever" rule — and checks 2 and 4
# cross-reference a local oțios checkout (its installed `wordfreq`, its
# vendored `inflected_forms.db`). Those two already skip rather than fail when
# the reference is absent, by design.
#
# So the pipeline's *logic* is covered here by the test suite instead,
# including end-to-end runs of every stage over synthetic databases, the
# read-only validator, and the independent rebuild (tests/). Running the strict
# real-data validation (build/validate.py --strict) stays a local pre-release
# step; its hash-bound report travels inside the release-candidate bundle.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.10"; test the floor and the
        # current release so a 3.10-incompatible syntax slip fails here rather
        # than for someone who pip-installed on an older interpreter.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (package + dev + build extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"
      - name: Tests
        run: pytest -q

  pipeline-scripts:
    # The build/ scripts are not importable by the test suite's normal paths
    # and have no coverage of their own beyond the units tested in tests/.
    # A syntax error or a bad import in an ingester would otherwise only
    # surface hours into a multi-day job.
    name: build scripts load
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"
      - name: Every build script compiles
        run: python -m compileall -q build/ tools/
      - name: The DEX extractor (tools/) responds
        run: python tools/dex_extractor/extract_inflected_forms.py --help > /dev/null
      - name: Every build script's CLI responds
        run: |
          set -e
          for f in build/*.py; do
            echo "--- $f --help"
            python "$f" --help > /dev/null
          done

  package:
    # The old job built a wheel from the checkout, where the data files are
    # gitignored, so it shipped a data-less wheel and called that a pass (brief
    # B7, finding A08). Now: build a tiny *synthetic* generation through the real
    # pipeline, stage it, build the sdist and the wheel FROM that sdist, check
    # both archives carry the generation's files and build id, then install the
    # wheel into a clean venv outside the checkout (PYTHONPATH unset) and look
    # words up. Lemma present and lemma absent are both exercised. The bundles
    # are marked synthetic; the release gate rejects them by construction.
    name: sdist -> wheel with data, installed and used
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"
      - name: Synthetic generation, bundle, install (lemma layer present)
        run: |
          gen=$(python build/make_synthetic.py --out-dir "$RUNNER_TEMP/syn" | tail -1)
          python build/make_distribution.py --generation "$gen" --out "$RUNNER_TEMP/bundle" --allow-synthetic
          env -u PYTHONPATH python build/check_release.py --bundle "$RUNNER_TEMP/bundle" --mode ci-synthetic --install-test
      - name: Synthetic generation, bundle, install (lemma layer absent)
        run: |
          gen=$(python build/make_synthetic.py --no-lemma --out-dir "$RUNNER_TEMP/syn-nolemma" | tail -1)
          python build/make_distribution.py --generation "$gen" --out "$RUNNER_TEMP/bundle-nolemma" --allow-synthetic
          env -u PYTHONPATH python build/check_release.py --bundle "$RUNNER_TEMP/bundle-nolemma" --mode ci-synthetic --install-test
